<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="newLine" type="text" name="newLine">
<button onclick="addElement()">Crear</button>
<ul id = "lista"></ul>
<script>

    function addElement() {
        var elemento = document.getElementById("newLine");
        var lista = document.getElementById("lista");

        if(elemento.value.trim() != "") {

            var nuevoLi = document.createElement("li");

            nuevoLi.textContent = elemento.value;

            lista.appendChild(nuevoLi);

            elemento.value = "";


        } else {
            alert("Escribe algo")
        }
    }

</script>
</body>
</html>
