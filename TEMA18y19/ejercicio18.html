<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let frase = prompt("Pon una frase: ");

        let palabras = frase.split(" ");
        document.write("El numero de palbras que tiene la frase es " + palabras.length);

        document.write("<br>");

        for (let i = 0; i < palabras.length; i++) {
            document.write(i + ":" + palabras[i] + "<br>");
        }
    </script>
</body>
</html>
