<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

            let array = [];
            
            for (i = 1; i <= 6; i++) {

                let numero = Math.floor(Math.random() * 49) + 1;

                if(!array.includes(numero)){
                    array.push(numero);
                } else {
                    i--;
                }
                
            }

            document.write(array);

    </script>
</body>
</html>
