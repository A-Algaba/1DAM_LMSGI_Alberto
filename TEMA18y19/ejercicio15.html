<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let frase = prompt("Escribe la letra a");
        let contador = 0;

        for (let i = 0; i < frase.length; i++) {
            if(frase.charAt(i).toLocaleLowerCase() == "a") {
                contador ++;
            }
        }

        document.write("La letra a se repite: " + contador + " veces");
    </script>
</body>
</html>
