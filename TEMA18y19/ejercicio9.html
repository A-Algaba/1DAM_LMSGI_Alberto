<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="invertido" onclick="invertir()">click aqui</h1>
</body>
    <script>
        function invertir() { 
            let resultado = prompt("Pon una frase: ");

            if(resultado) {
            let invertido = resultado.split("").reverse().join("");

            document.write("<h1>" + invertido + "</h1>");
            }
        }
    </script>
</html>
